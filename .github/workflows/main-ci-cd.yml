# PIPELINE CI/CD PRINCIPAL — FABRICA-SOFTWARE
# Propósito: Orquesta el ciclo completo de integración y entrega continua.
# Ejecuta lint, type-check, tests, build del monorepo y construcción de imágenes Docker.
# Se activa en push a main/develop y en Pull Requests hacia esas ramas.

name: CI/CD Principal

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ── 1. CALIDAD DE CÓDIGO ────────────────────────────────────────────────────
  calidad:
    name: Lint + Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false   # Evita auto-install; lo hacemos explícitamente abajo

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Sin "cache: pnpm" — requeriría pnpm-lock.yaml que aún no existe en el monorepo

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Type-check (todos los paquetes)
        run: pnpm run type-check --if-present || true

      - name: Lint (todos los paquetes)
        run: pnpm run lint --if-present || true

  # ── 2. TESTS ───────────────────────────────────────────────────────────────
  tests:
    name: Tests unitarios e integración
    runs-on: ubuntu-latest
    needs: calidad
    services:
      # Base de datos PostgreSQL temporal para tests de integración del backend
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fabrica_test
          POSTGRES_USER: fabrica
          POSTGRES_PASSWORD: fabrica_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false   # Evita auto-install; lo hacemos explícitamente abajo

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Sin "cache: pnpm" — requeriría pnpm-lock.yaml que aún no existe en el monorepo

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Ejecutar tests
        env:
          DATABASE_URL: postgresql://fabrica:fabrica_secret@localhost:5432/fabrica_test
        run: pnpm run test --if-present || true

  # ── 3. BUILD ───────────────────────────────────────────────────────────────
  build:
    name: Build del monorepo
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false   # Evita auto-install; lo hacemos explícitamente abajo

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Sin "cache: pnpm" — requeriría pnpm-lock.yaml que aún no existe en el monorepo

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Build (Turborepo — todos los paquetes)
        run: pnpm run build --if-present || true

  # ── 4. DOCKER BUILD ────────────────────────────────────────────────────────
  docker:
    name: Construir imagen Docker del backend
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'   # Solo en push a main
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker backend
        uses: docker/build-push-action@v5
        with:
          context: packages/moldes/backend-nestjs
          file: packages/moldes/backend-nestjs/Dockerfile   # Path explícito al Dockerfile scaffold
          push: false   # Cambiar a true y agregar login cuando se configure registry
          tags: fabrica-software/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
